[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genblaze-bespoken"
version = "0.1.0"
description = "Genblaze provider connectors for the Bespoken self-hosted, ElevenLabs-compatible TTS service (Chatterbox on Replicate)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John F Morton" }]
keywords = ["genblaze", "tts", "text-to-speech", "bespoken", "backblaze", "provenance"]
dependencies = [
    "genblaze-core>=0.3,<0.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "genblaze-s3>=0.3,<0.4",
    "pyarrow>=15",
]

# Discovered at runtime by genblaze_core.providers.registry.discover_providers().
[project.entry-points."genblaze.providers"]
bespoken-tts = "genblaze_bespoken.provider_tts:BespokenTTSProvider"
bespoken-chunk = "genblaze_bespoken.provider_chunk:BespokenChunkProvider"
bespoken-qa = "genblaze_bespoken.provider_qa:BespokenQAProvider"
bespoken-stitch = "genblaze_bespoken.provider_stitch:BespokenStitchProvider"

[tool.setuptools.packages.find]
include = ["genblaze_bespoken*"]

[tool.setuptools.package-data]
genblaze_bespoken = ["py.typed"]
