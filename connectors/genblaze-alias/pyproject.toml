[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genblaze-alias"
version = "0.1.0"
description = "Genblaze provider connectors for the Alias self-hosted, ElevenLabs-compatible TTS service (Chatterbox on Replicate)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John F Morton" }]
keywords = ["genblaze", "tts", "text-to-speech", "alias", "backblaze", "provenance"]
dependencies = [
    "genblaze-core>=0.3,<0.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "genblaze-s3>=0.3,<0.4",
    "pyarrow>=15",
]

# Discovered at runtime by genblaze_core.providers.registry.discover_providers().
[project.entry-points."genblaze.providers"]
alias-tts = "genblaze_alias.provider_tts:AliasTTSProvider"
alias-chunk = "genblaze_alias.provider_chunk:AliasChunkProvider"
alias-qa = "genblaze_alias.provider_qa:AliasQAProvider"
alias-stitch = "genblaze_alias.provider_stitch:AliasStitchProvider"

[tool.setuptools.packages.find]
include = ["genblaze_alias*"]

[tool.setuptools.package-data]
genblaze_alias = ["py.typed"]
