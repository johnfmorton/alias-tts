[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genblaze-mimic"
version = "0.1.0"
description = "Genblaze provider connectors for the Mimic self-hosted, ElevenLabs-compatible TTS service (Chatterbox on Replicate)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John F Morton" }]
keywords = ["genblaze", "tts", "text-to-speech", "mimic", "backblaze", "provenance"]
dependencies = [
    "genblaze-core>=0.3,<0.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "genblaze-s3>=0.3,<0.4",
    "pyarrow>=15",
]

# Discovered at runtime by genblaze_core.providers.registry.discover_providers().
[project.entry-points."genblaze.providers"]
mimic-tts = "genblaze_mimic.provider_tts:MimicTTSProvider"
mimic-chunk = "genblaze_mimic.provider_chunk:MimicChunkProvider"
mimic-qa = "genblaze_mimic.provider_qa:MimicQAProvider"
mimic-stitch = "genblaze_mimic.provider_stitch:MimicStitchProvider"

[tool.setuptools.packages.find]
include = ["genblaze_mimic*"]

[tool.setuptools.package-data]
genblaze_mimic = ["py.typed"]
