; PHP overrides for the single-image Docker package. Installed as
; $PHP_INI_DIR/conf.d/zz-alias.ini so it wins over the bundled defaults.

; Audio work (stitching long projects, hashing sealed finals) needs headroom.
memory_limit = 512M

; Reference clips and the opt-in /verify upload fallback
; (TTS_VERIFY_MAX_UPLOAD_KB, default 200 MB) must fit in one request. Caddy
; imposes no body cap of its own, so these two are the effective limit —
; `php artisan tts:doctor --deep` probes exactly this.
upload_max_filesize = 256M
post_max_size = 256M

; The synchronous /v1 path may legitimately run for minutes on long text
; (sequential provider calls); TTS_REQUEST_TIMEOUT governs the inner budget.
max_execution_time = 300

expose_php = Off

; Code in a container is immutable after boot, so skip stat calls entirely.
; Every cache (config/route/view) is rebuilt by the entrypoint before the
; server starts.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
