; Process tree for the single-image Docker package. One container runs the
; whole service: web app, queue worker, scheduler, and both Python sidecars.
; Environment for every program is inherited from the entrypoint, which merges
; container-provided env over the persisted /data/.env.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Local control socket so `docker exec <c> supervisorctl status` works.
[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

; --- Web (FrankenPHP / Caddy) -------------------------------------------------
[program:web]
command=frankenphp run --config /etc/frankenphp/Caddyfile
directory=/var/www/html
user=app
environment=HOME="/home/app",USER="app"
autorestart=true
priority=10
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Queue worker (async /v1 jobs + Genblaze runs) ----------------------------
; Flags mirror docs/DEPLOYMENT.md. The async TTS job pins its own timeout
; (TTS_ASYNC_TIMEOUT), so no --timeout here. SIGTERM lets the current job
; finish; a database-queue job interrupted anyway re-releases after retry_after.
[program:queue]
command=php artisan queue:work --queue=default --sleep=3 --tries=1
directory=/var/www/html
user=app
environment=HOME="/home/app",USER="app"
autorestart=true
priority=30
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Scheduler (speech:cleanup, recovery/clip pruning, doctor heartbeat) ------
; schedule:work runs schedule:run every minute in the foreground — the
; container replacement for the crontab entry in docs/DEPLOYMENT.md.
[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
user=app
environment=HOME="/home/app",USER="app"
autorestart=true
priority=30
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Whisper ASR sidecar (transcript QA gate) ----------------------------------
; Model + device knobs come from the environment (ASR_MODEL etc., defaulted by
; the entrypoint); the model itself lives on /data/asr-models, pre-seeded with
; "tiny" from the image so first boot works offline.
[program:asr]
command=/opt/asr/bin/uvicorn app:app --host 127.0.0.1 --port 8765 --app-dir /var/www/html/asr-sidecar
directory=/var/www/html/asr-sidecar
user=app
environment=HOME="/home/app",USER="app"
autorestart=true
priority=20
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- Genblaze runner (whole-render orchestration + pronunciation LLM) ----------
; PYTHONPATH (set by the entrypoint) points at the in-image genblaze-runner/
; and connectors/genblaze-alias packages, mirroring the Forge daemon layout.
[program:runner]
command=/opt/runner/bin/uvicorn genblaze_runner.app:app --host 127.0.0.1 --port 8800
directory=/var/www/html
user=app
environment=HOME="/home/app",USER="app"
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
