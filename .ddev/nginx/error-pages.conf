# Branded error pages for nginx-level failures (mirrors the prod Forge config).
#
# Included at server scope via the base config's `include /mnt/ddev_config/nginx/*.conf;`.
# These only fire for errors nginx raises itself — Laravel-level errors
# (abort/auth 403, app 500, maintenance 503) still pass through to the Blade
# views in resources/views/errors/ because fastcgi_intercept_errors is off.
#
#   403  -> deny rules (dotfiles/backup files), directory access with no index
#   5xx  -> php-fpm unreachable/timeout (PHP can't render, so serve static)
#
# 404 is intentionally NOT here: unmatched paths already route to /index.php,
# so Laravel renders its branded 404.

error_page 403 /errors/403.html;
error_page 500 502 503 504 /errors/offline.html;

location = /errors/403.html     { internal; }
location = /errors/offline.html { internal; }
