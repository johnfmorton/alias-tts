# Builds the single-image Docker package (see docs/DOCKER.md) for amd64 +
# arm64 and pushes it to the GitHub Container Registry. The package inherits
# the repo's visibility (private) — grant pull access per user in the
# package's settings on GitHub.
#
# Runs on every vX.Y.Z tag push (the /commitchange release flow), so cutting
# a release publishes ghcr.io/johnfmorton/alias-tts:X.Y.Z + :latest. The
# arm64 leg builds under QEMU on the amd64 runner, which is slow but free;
# the asset/vendor stages are pinned to the build platform in the Dockerfile
# so only the runtime stage pays the emulation tax.
#
# Manual runs (Actions → Docker image → Run workflow): leave the tag input
# empty for a smoke build published as :main, or set it (e.g. "0.36.0") to
# also publish that tag + :latest — used to backfill a release cut before
# this workflow existed.

name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra image tag (e.g. 0.36.0); also tags :latest. Empty = branch-name smoke build."
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
