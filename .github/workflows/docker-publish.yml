# Builds the single-image Docker package (see docs/DOCKER.md) for amd64 +
# arm64 and pushes it to the GitHub Container Registry. The package inherits
# the repo's visibility (private) — grant pull access per user in the
# package's settings on GitHub.
#
# MANUAL-ONLY by design: releases are cut far more often than image users
# need them, and each run costs 30-60 private-repo Actions minutes (the
# arm64 leg builds under QEMU; the asset/vendor stages are pinned to the
# build platform in the Dockerfile so only the runtime stage pays the
# emulation tax). To publish a version: Actions → Docker image → Run
# workflow, set the tag input to the version (e.g. "0.36.0") — that
# publishes ghcr.io/johnfmorton/alias-tts:0.36.0 + :latest from the chosen
# ref. Leave the input empty for a :main smoke build. If image users ever
# want every release, restore an `on: push: tags: ["v*"]` trigger.

name: Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.36.0); also tags :latest. Empty = branch-name smoke build."
        required: false
        default: ""

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build on the amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
